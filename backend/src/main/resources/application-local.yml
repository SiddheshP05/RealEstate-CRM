spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sai_vandan_crm}
    username: ${SPRING_DATASOURCE_USERNAME:crm}
    password: ${SPRING_DATASOURCE_PASSWORD:crm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: 8080
app:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-key-change-before-production-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
